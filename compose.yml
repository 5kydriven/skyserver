name: landing

services:
  landing:
    build: .
    image: skyserver-landing:local
    container_name: homelab-landing
    restart: unless-stopped
    networks:
      - npm_network
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  npm_network:
    external: true
    name: npm_default
